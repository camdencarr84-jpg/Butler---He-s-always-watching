<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Broadcast · Butler</title>
<link rel="stylesheet" href="./styles.css" />
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<header class="nav">
  <a class="brand" href="./"><span class="dot"></span> Butler</a>
  <nav><a href="./viewer.html">Watch mode →</a></nav>
</header>

<div class="studio">
  <div>
    <div class="stage">
      <video id="preview" autoplay muted playsinline></video>
      <div class="badge" id="liveBadge" style="display:none"><span class="live"></span> LIVE</div>
    </div>
    <div class="log" id="log" style="margin-top:14px">Ready.</div>
  </div>

  <aside class="panel">
    <h2>Camera & Mic</h2>
    <div class="field">
      <label>Camera</label>
      <select class="input" id="camSel"></select>
    </div>
    <div class="field">
      <label>Microphone</label>
      <select class="input" id="micSel"></select>
    </div>
    <div class="row">
      <button class="btn primary" id="goLive">Go Live</button>
      <button class="btn ghost" id="stop" disabled>Stop</button>
    </div>

    <h2>Share Link</h2>
    <div class="status" id="sigStatus"><span class="d"></span><span id="sigText">Idle</span></div>
    <div class="copy">
      <input class="input" id="link" readonly placeholder="Go live to generate link" />
      <button class="btn ghost" id="copyBtn">Copy</button>
    </div>

    <h2>Recording</h2>
    <div class="row">
      <button class="btn ok" id="recBtn" disabled>● Record</button>
      <button class="btn ghost" id="recStop" disabled>Stop & Save</button>
    </div>

    <h2>Viewers (<span id="vCount">0</span>)</h2>
    <div class="peers" id="peers"></div>
  </aside>
</div>

<script src="./app.js"></script>
<script>initHost();</script>
</body>
</html>
